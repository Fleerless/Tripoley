# Reusable deploy pipeline, called by deploy-production.yml.
# Promotes an already-built release artifact to one environment:
#   - API:    point Elastic Beanstalk at the application version that was built
#             and registered when the release was cut (see release-please.yml).
#             No rebuild happens here, so the environment runs the exact image
#             that was released, and rollback is a re-point to an older version.
#   - Client: build tripoley-web against the env's hub URL, sync to S3, invalidate CDN.
#             The SPA bakes VITE_HUB_URL at build time, so it is still built per env.
#
# The deployed version comes from .release-please-manifest.json; it is the
# version label of the artifact to promote.
#
# Auth is via GitHub OIDC -> an IAM role (no long-lived AWS keys stored in GitHub).
#
# The production GitHub Environment must define these *variables* (Settings
# -> Environments -> production -> Variables). None are secret:
#   EB_ENVIRONMENT_NAME         tripoley-api-production
#   VITE_HUB_URL                https://api.tripoley.jeffreyfleer.com/hubs/gamehub
#   S3_BUCKET                   tripoley.jeffreyfleer.com
#   CLOUDFRONT_DISTRIBUTION_ID  the env's client CloudFront distribution id
# These *repository* variables are shared by the build (release-please.yml) and
# deploy jobs, so they live at repo scope rather than on the environment:
#   AWS_REGION                  us-west-2
#   AWS_DEPLOY_ROLE_ARN         arn of the OIDC deploy role
#   ECR_REPOSITORY              tripoley-api

name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to deploy (production)
        required: true
        type: string

# Never run two deploys for the same environment at once.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # required for AWS OIDC
      contents: read
    env:
      EB_APPLICATION: tripoley-api
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "value=$(jq -r '."."' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ---- Promote the already-built image by version label (no rebuild) ----
      - name: Promote Elastic Beanstalk application version
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"

          # The artifact is built and registered when the release is cut. Fail
          # loudly if it is missing rather than silently rebuilding a different one.
          EXISTING=$(aws elasticbeanstalk describe-application-versions \
            --application-name "$EB_APPLICATION" --version-labels "$VERSION" \
            --query "length(ApplicationVersions)" --output text)
          if [ "$EXISTING" = "0" ]; then
            echo "::error::No EB application version '$VERSION' to promote. Was the release artifact built?"
            exit 1
          fi

          aws elasticbeanstalk update-environment \
            --environment-name "${{ vars.EB_ENVIRONMENT_NAME }}" \
            --version-label "$VERSION"

          # Block until the environment finishes updating. NOTE: this also returns
          # after a ROLLBACK (the env is Ready again), so on its own it does NOT
          # mean the new version deployed.
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${{ vars.EB_ENVIRONMENT_NAME }}"

          # Gate 1: EB reports the target version as deployed. A crash-on-boot
          # deploy rolls back, so a mismatch here means the API did not ship and we
          # must not go on to deploy the web (the half-apply that leaves new web
          # against an old API).
          LIVE=$(aws elasticbeanstalk describe-environments \
            --environment-names "${{ vars.EB_ENVIRONMENT_NAME }}" \
            --query 'Environments[0].VersionLabel' --output text)
          if [ "$LIVE" != "$VERSION" ]; then
            echo "::error::Deploy rolled back: environment is on '$LIVE', not '$VERSION'. Aborting before the web deploy."
            exit 1
          fi

          # Gate 2: the API actually serves the target version over HTTPS. This is
          # the real health signal (EB enhanced health is unreliable on this env and
          # reports Red even while the app serves 200s); it also catches a container
          # that deployed but is not serving. Retry to give the new container time.
          API_ORIGIN="${{ vars.VITE_HUB_URL }}"; API_ORIGIN="${API_ORIGIN%/hubs/*}"
          SERVED=""
          for _ in 1 2 3 4 5 6; do
            SERVED=$(curl -fsS -m 10 "$API_ORIGIN/version" 2>/dev/null || true)
            [ "$SERVED" = "$VERSION" ] && break
            echo "waiting for the API to serve $VERSION (got '$SERVED')..."
            sleep 10
          done
          if [ "$SERVED" != "$VERSION" ]; then
            echo "::error::API at $API_ORIGIN/version is serving '$SERVED', not '$VERSION'. Aborting before the web deploy."
            exit 1
          fi
          echo "Promoted and verified: EB on $VERSION, API serving $VERSION."

      # ---- Web client (still built per env: VITE_HUB_URL is compiled in) ----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tripoley-web/package-lock.json

      - name: Build web client
        working-directory: tripoley-web
        env:
          VITE_HUB_URL: ${{ vars.VITE_HUB_URL }}
          VITE_APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          npm ci
          npm run build

      - name: Sync client to S3
        run: aws s3 sync tripoley-web/dist "s3://${{ vars.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
