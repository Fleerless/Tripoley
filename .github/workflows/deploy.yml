# Reusable deploy pipeline, called by deploy-production.yml.
# Deploys both halves of the app for one environment:
#   - API:    build the Docker image, push to ECR (tagged with the commit SHA),
#             then ship it to Elastic Beanstalk as a new application version.
#   - Client: build tripoley-web against the env's hub URL, sync to S3, invalidate CDN.
#
# The deployed version (for /version and the client) comes from
# .release-please-manifest.json, so it tracks the release-please release.
#
# Auth is via GitHub OIDC -> an IAM role (no long-lived AWS keys stored in GitHub).
#
# The production GitHub Environment must define these *variables* (Settings
# -> Environments -> production -> Variables). None are secret:
#   AWS_REGION                  us-west-2
#   AWS_DEPLOY_ROLE_ARN         arn of the OIDC deploy role
#   ECR_REPOSITORY              tripoley-api
#   EB_ENVIRONMENT_NAME         tripoley-api-production
#   VITE_HUB_URL                https://api.tripoley.jeffreyfleer.com/hubs/gamehub
#   S3_BUCKET                   tripoley.jeffreyfleer.com
#   CLOUDFRONT_DISTRIBUTION_ID  the env's client CloudFront distribution id

name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to deploy (production)
        required: true
        type: string

# Never run two deploys for the same environment at once.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # required for AWS OIDC
      contents: read
    env:
      EB_APPLICATION: tripoley-api
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "value=$(jq -r '."."' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ---- API image -> ECR ----
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:${{ github.sha }}"
          docker build --build-arg APP_VERSION="${{ steps.version.outputs.value }}" \
            -t "$IMAGE" -t "$REGISTRY/$REPOSITORY:${{ inputs.environment }}" .
          docker push "$IMAGE"
          docker push "$REGISTRY/$REPOSITORY:${{ inputs.environment }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # ---- Ship the image to Elastic Beanstalk ----
      - name: Deploy to Elastic Beanstalk
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          EB_BUCKET="elasticbeanstalk-${{ vars.AWS_REGION }}-${ACCOUNT_ID}"
          VERSION_LABEL="${{ inputs.environment }}-${{ github.sha }}"

          # Bundle only a Dockerrun that points EB at the freshly pushed image.
          printf '{"AWSEBDockerrunVersion":"1","Image":{"Name":"%s","Update":"true"},"Ports":[{"ContainerPort":8080}]}\n' \
            "$IMAGE" > Dockerrun.aws.json
          zip -q "${VERSION_LABEL}.zip" Dockerrun.aws.json

          aws s3 cp "${VERSION_LABEL}.zip" "s3://${EB_BUCKET}/${EB_APPLICATION}/${VERSION_LABEL}.zip"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION_LABEL" \
            --source-bundle "S3Bucket=${EB_BUCKET},S3Key=${EB_APPLICATION}/${VERSION_LABEL}.zip" \
            --no-process

          aws elasticbeanstalk update-environment \
            --environment-name "${{ vars.EB_ENVIRONMENT_NAME }}" \
            --version-label "$VERSION_LABEL"

          # Block until the environment finishes updating and reports Ready.
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${{ vars.EB_ENVIRONMENT_NAME }}"

      # ---- Web client ----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tripoley-web/package-lock.json

      - name: Build web client
        working-directory: tripoley-web
        env:
          VITE_HUB_URL: ${{ vars.VITE_HUB_URL }}
          VITE_APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          npm ci
          npm run build

      - name: Sync client to S3
        run: aws s3 sync tripoley-web/dist "s3://${{ vars.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
