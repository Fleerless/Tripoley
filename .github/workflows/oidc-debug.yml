name: oidc-debug

on:
  push:
    branches: [develop]
    paths: ['.github/workflows/oidc-debug.yml']

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Fetch and decode the OIDC token claims
        run: |
          RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" | python3 -c "
          import sys,base64,json
          jwt=sys.stdin.read().strip()
          p=jwt.split('.')[1]; p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          for k in ['iss','aud','sub','repository','repository_owner','environment','ref','job_workflow_ref']:
              print(f'CLAIM {k} = {c.get(k)}')
          "
