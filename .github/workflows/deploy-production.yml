# Production deploy: fires when stage is merged into production.
name: deploy-production

on:
  push:
    branches: [production]

# A caller must grant the permissions its reusable workflow requests; without
# this the OIDC id-token request exceeds the caller's token and the run fails
# to start.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
