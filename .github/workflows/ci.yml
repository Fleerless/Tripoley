name: CI

on:
  push:
    branches: [develop, production]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Tripoley.slnx

      - name: Build
        run: dotnet build Tripoley.slnx --configuration Release --no-restore

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Tripoley.slnx

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Test with coverage gate
        run: dotnet test Tripoley.slnx --configuration Release --no-restore --nologo /p:CollectCoverage=true

      - name: Coverage report (undercovered classes)
        if: always()
        run: |
          dotnet tool run reportgenerator \
            -reports:"*.Tests/coverage.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"TextSummary;MarkdownSummaryGithub"
          cat coverage-report/Summary.txt
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tripoley-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tripoley-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Tripoley.slnx

      - name: Check formatting and code style
        run: dotnet format style Tripoley.slnx --verify-no-changes --no-restore

  contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Regenerate the TypeScript contract
        run: dotnet run --project Tripoley.ContractGen -- tripoley-web/src/api/contracts.ts

      - name: Fail if the generated contract is out of date
        run: git diff --exit-code tripoley-web/src/api/contracts.ts
